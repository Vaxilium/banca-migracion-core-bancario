[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
addopts = "-ra"
markers = [
    "lento: pruebas de mayor duracion (pipeline completo reducido)",
    "integracion: pruebas sobre artefactos generados por el pipeline",
    "escenario: escenario Gherkin cubierto por la prueba",
]
