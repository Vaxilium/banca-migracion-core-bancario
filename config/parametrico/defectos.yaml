# Tasas de inyeccion de defectos sinteticos por entidad. Cada defecto inyectado
# queda registrado en datos/verdad/defectos_inyectados.csv (verdad de terreno) para
# medir la deteccion real del pipeline. Rango objetivo global: 3 % a 6 %.

clientes:
  duplicado_nombre_variante: 0.015
  documento_invalido: 0.008
  documento_repetido_otro_cliente: 0.004
  fecha_nacimiento_imposible: 0.005
documentos:
  vencido_sin_marcar: 0.02
direcciones:
  incompleta: 0.03
cuentas:
  huerfana: 0.006
  estado_desconocido: 0.01
  producto_fuera_alcance: 0.03
  producto_desconocido: 0.02
movimientos:
  signo_invertido: 0.006
  fecha_imposible: 0.003
  duplicado_reproceso: 0.005
saldos:
  descuadre_leve: 0.009
  descuadre_grave: 0.001
prestamos:
  saldo_incongruente: 0.01
plazos_fijos:
  vencimiento_incongruente: 0.005
mandatos:
  cuenta_inexistente: 0.004
contabilidad:
  filas_con_desfase: 8
